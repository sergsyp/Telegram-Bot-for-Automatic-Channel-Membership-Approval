name: OpenSpec validation

on:
  pull_request:
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yml"
  push:
    branches: [main]
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.12.0 validate --all --strict --no-interactive
